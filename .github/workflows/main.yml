name: CodingTrolling Build & Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags like v1.0.1

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Generate Version Tag
        id: tag_version
        run: |
          # Creates a unique tag based on the run number if no tag exists
          TAG="v1.0.${{ github.run_number }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.TAG }}
          name: CodingTrolling Hub ${{ steps.tag_version.outputs.TAG }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## 🚀 CodingTrolling Hub 6-Tool Suite
            Automatically compiled via GitHub Actions.
            
            **Included Modules:**
            - 🔗 Neural Link (Remote ADB)
            - 🧠 Bozin AI (Neural Interface)
            - 📟 VM Matrix (Hypervisor)
            - 🎨 Panny Painting (Canvas)
            - 📑 PDF Reader
            - 🎥 Media Reader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
